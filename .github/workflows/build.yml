name: Build AxiomBox (TrollStore)

on:
  push:
    branches: [ main, master, mod/** ]
  workflow_dispatch:

jobs:
  build:
    # NOTE: macos-13 was retired 2025-12-04 and macos-14 on 2026-11-02.
    # macos-15 (arm64 / Apple Silicon) is a currently supported label.
    runs-on: macos-15
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode 16.4
        # macOS 15 image ships Xcode 16.0-16.4 and 26.x; Xcode 15.x is NOT present.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install build dependencies
        run: |
          brew update
          brew install dpkg ldid make libplist openssl@3 libarchive pkg-config xz
          # Theos requires GNU make as "make"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          # fastPathSign uses pkg-config --libs libcrypto (from openssl@3)
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS 16.5 SDK
        # Makefiles pin TARGET := iphone:clang:16.5:14.0, so the patched
        # iPhoneOS16.5.sdk (with private symbols) from theos/sdks is required.
        # Clone into a SEPARATE temp dir: theos already ships a non-empty sdks/
        # directory, so cloning directly into $THEOS/sdks fails.
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/sdks-src"
          cd "$HOME/sdks-src"
          git sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$HOME/sdks-src/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          echo "== installed SDKs =="
          ls -1 "$THEOS/sdks"

      - name: Verify toolchain
        run: |
          which make && make --version | head -1
          pkg-config --modversion libcrypto
          ls "$THEOS/sdks/iPhoneOS16.5.sdk" >/dev/null && echo "iOS 16.5 SDK OK"

      - name: Build (main chain, installer IPA targets skipped)
        # Root Makefile forwards $(MAKECMDGOALS) to every sub-make. Running
        # `make all` would pass the literal "all" down, but sub-Makefiles
        # (e.g. fastPathSign) have NO `all` target -> "No rule to make target".
        # A bare `make` leaves MAKECMDGOALS empty, so each sub-make uses its own
        # default target. build_installer15/64e were removed from the `all`
        # chain because they need the unshipped Victim/InstallerVictim.ipa.
        run: make

      - name: List artifacts
        run: ls -lh _build/

      - name: Upload AxiomBox tar (install via TrollStore)
        uses: actions/upload-artifact@v4
        with:
          name: AxiomBox-tar
          path: _build/AxiomBox.tar
          if-no-files-found: error

      - name: Upload packages (deb, optional)
        uses: actions/upload-artifact@v4
        with:
          name: AxiomBox-debs
          path: packages/*.deb
          if-no-files-found: warn
